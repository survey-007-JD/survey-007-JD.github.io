<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interaktive Analysekarte zu Orten und Reiseroute.">
  <title>Erweiterte Visualisierung – Orte und Reiseroute</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { color-scheme: light; --ink: #102442; --muted: #52647b; --blue: #185caa; --pink: #de4c85; --orange: #dd7a22; --paper: #fff; }
    * { box-sizing: border-box; }
    html, body, #map { height: 100%; margin: 0; }
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: #e8eef5; }
    #map { min-height: 460px; }
    .leaflet-control-layers { border: 0; border-radius: 10px; box-shadow: 0 3px 18px rgb(16 36 66 / 20%); font-size: 13px; }
    .map-title { max-width: 280px; margin: 12px; padding: 13px 15px; border-radius: 12px; background: rgb(255 255 255 / 94%); box-shadow: 0 3px 18px rgb(16 36 66 / 20%); }
    .map-title h1 { margin: 0 0 4px; font-size: 16px; line-height: 1.2; }
    .map-title p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .legend { padding: 11px 13px; border-radius: 10px; background: rgb(255 255 255 / 94%); box-shadow: 0 3px 18px rgb(16 36 66 / 20%); color: var(--ink); font-size: 12px; line-height: 1.55; }
    .legend strong { display: block; margin-bottom: 4px; }
    .legend i { display: inline-block; width: 11px; height: 11px; margin-right: 6px; border-radius: 50%; vertical-align: -1px; }
    .legend .line { width: 18px; height: 3px; border-radius: 0; background: var(--pink); vertical-align: 3px; }
    .popup-title { margin: 0 0 4px; color: var(--ink); font-size: 15px; }
    .popup-text { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .popup-tag { display: inline-block; margin-top: 8px; padding: 2px 7px; border-radius: 999px; background: #e4effb; color: #134f92; font-size: 11px; font-weight: 700; }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Interaktive Karte mit persönlichen Orten und Reiseroute"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const map = L.map('map', { scrollWheelZoom: true, zoomControl: false });
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const light = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 20,
      subdomains: 'abcd',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>-Mitwirkende &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener noreferrer">CARTO</a>'
    }).addTo(map);

    const places = [
      { name: 'Mainz', coords: [50.001, 8.272], text: 'Studien- und Ausgangsort der Karten.', kind: 'Persönlicher Ort', color: '#185caa' },
      { name: 'Pfullendorf', coords: [47.923, 9.257], text: 'Persönlicher Bezugspunkt in Baden-Württemberg.', kind: 'Persönlicher Ort', color: '#185caa' },
      { name: 'Ramsen (Pfalz)', coords: [49.536, 8.014], text: 'Persönlicher Bezugspunkt in Rheinland-Pfalz.', kind: 'Persönlicher Ort', color: '#185caa' },
      { name: 'Berlin', coords: [52.52, 13.405], text: 'Station der dargestellten Reiseroute.', kind: 'Reiseziel', color: '#dd7a22' },
      { name: 'Den Haag', coords: [52.07, 4.3], text: 'Station der dargestellten Reiseroute.', kind: 'Reiseziel', color: '#dd7a22' },
      { name: 'Paris', coords: [48.857, 2.352], text: 'Endpunkt der dargestellten Reiseroute.', kind: 'Reiseziel', color: '#dd7a22' }
    ];

    const personalLayer = L.layerGroup();
    const travelLayer = L.layerGroup();
    const pointBounds = [];

    places.forEach(place => {
      const marker = L.circleMarker(place.coords, {
        radius: place.kind === 'Persönlicher Ort' ? 8 : 7,
        color: '#fff', weight: 2, fillColor: place.color, fillOpacity: 0.96
      }).bindPopup(
        '<h2 class="popup-title">' + place.name + '</h2>' +
        '<p class="popup-text">' + place.text + '</p>' +
        '<span class="popup-tag">' + place.kind + '</span>'
      );
      (place.kind === 'Persönlicher Ort' ? personalLayer : travelLayer).addLayer(marker);
      pointBounds.push(place.coords);
    });

    const routeCoordinates = [[50.001, 8.272], [52.52, 13.405], [52.07, 4.3], [48.857, 2.352]];
    const routeLayer = L.layerGroup([
      L.polyline(routeCoordinates, { color: '#de4c85', weight: 4, opacity: 0.85, dashArray: '8 7' })
        .bindPopup('<h2 class="popup-title">Reiseroute</h2><p class="popup-text">Mainz → Berlin → Den Haag → Paris</p>')
    ]);

    personalLayer.addTo(map);
    travelLayer.addTo(map);
    routeLayer.addTo(map);
    map.fitBounds(pointBounds, { padding: [36, 36] });

    L.control.layers(
      { 'Helle Hintergrundkarte': light },
      { 'Persönliche Orte': personalLayer, 'Reiseroute': routeLayer, 'Reiseziele': travelLayer },
      { collapsed: false, position: 'topright' }
    ).addTo(map);

    const title = L.control({ position: 'topleft' });
    title.onAdd = () => {
      const element = L.DomUtil.create('section', 'map-title');
      element.innerHTML = '<h1>Orte &amp; Reiseroute</h1><p>6 Orte · 4 Stationen · Ebenen frei kombinierbar</p>';
      L.DomEvent.disableClickPropagation(element);
      return element;
    };
    title.addTo(map);

    const legend = L.control({ position: 'bottomleft' });
    legend.onAdd = () => {
      const element = L.DomUtil.create('div', 'legend');
      element.innerHTML = '<strong>Legende</strong><span><i style="background:#185caa"></i>Persönlicher Ort</span><br><span><i style="background:#dd7a22"></i>Reiseziel</span><br><span><i class="line"></i>Reiseroute</span>';
      return element;
    };
    legend.addTo(map);
  </script>
</body>
</html>
